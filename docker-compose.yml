# База для разработки: порт 5437, пароль qwerty. Приложение запускается локально (см. README).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: "qwerty"
    ports:
      - "5437:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db_data:
